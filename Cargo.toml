[package]
name = "netprobe"
version = "0.1.0"
edition = "2021"
authors = ["Juan Castiñeira <juancastingo@gmail.com>"]
description = "Fast, transparent network diagnostics tool testing DNS, TCP, TLS, and HTTP with latency waterfall and root-cause failure analysis."
repository = "https://github.com/juancastingo/netprobe"
homepage = "https://github.com/juancastingo/netprobe"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["network", "diagnostics", "dns", "tls", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
x509-parser = "0.16"
httparse = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
url = "2.5"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
